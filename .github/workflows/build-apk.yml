name: Build APK

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat id tujuan
        required: true
      app_name:
        description: Nama aplikasi
        required: true
      url:
        description: URL website (mode URL)
        required: false
        default: ''
      icon_file_id:
        description: Telegram file_id ikon
        required: false
        default: ''
      site_file_id:
        description: Telegram file_id file HTML/ZIP (mode HTML)
        required: false
        default: ''
      site_file_name:
        description: Nama file HTML/ZIP
        required: false
        default: ''
      orientation:
        description: unspecified | portrait | landscape
        required: false
        default: unspecified
      fullscreen:
        description: true | false
        required: false
        default: 'false'
      theme_color:
        description: Warna tema (#RRGGBB)
        required: false
        default: '#7C3AED'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Build APK dan kirim ke Telegram
        id: build
        run: node build.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          APP_NAME: ${{ inputs.app_name }}
          START_URL: ${{ inputs.url }}
          ICON_FILE_ID: ${{ inputs.icon_file_id }}
          SITE_FILE_ID: ${{ inputs.site_file_id }}
          SITE_FILE_NAME: ${{ inputs.site_file_name }}
          ORIENTATION: ${{ inputs.orientation }}
          FULLSCREEN: ${{ inputs.fullscreen }}
          THEME_COLOR: ${{ inputs.theme_color }}

      - name: Beritahu user jika setup gagal
        if: failure() && steps.build.outcome == 'skipped'
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=❌ Build APK gagal sebelum dimulai. Silakan coba lagi nanti."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
